[project]
name = "crypto-data-live-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic-settings>=2,<3",
    "structlog>=24,<26",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
