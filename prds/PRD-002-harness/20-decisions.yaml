# GATE G1 — scope lock for PRD-002.
#
# Hypotheses come from 10-research.md, which materially corrected the brief. Blank `answer:`
# means the hypothesis stands.

decisions:
  - q: Is TA-Lib enough to make an indicator deterministic?
    hypothesis: >
      No, and the architecture doc was wrong to imply it. TA-Lib settles the FORMULA; it does
      not make recursive functions history-independent. EMA, RSI, ATR, ADX, CMO, DX, KAMA, T3
      and ~14 others have an "unstable period" — the same bar computed over 500 bars of history
      and over 5000 differs at the FINAL bar, converging rather than snapping. That is exactly
      the prior system's "same market, different score". The contract must therefore be
      "exactly N bars, most recent first", asserted at the call site — not merely "same bars,
      same window".
    answer:

  - q: How is the bar slice pinned?
    hypothesis: >
      Every indicator declares a required bar count in the registry, and the compute boundary
      REJECTS a slice that is not exactly that length. Not "at least" — exactly. A caller
      passing a growing cache is an error, not a slow drift.
    answer:

  - q: What about TA_SetUnstablePeriod?
    hypothesis: >
      Treat it as forbidden. It is process-global mutable state that "must be initialized from
      a single thread" and follows the function everywhere, so one test setting it changes
      every later test in the process — reproducing "same market, different score" INSIDE the
      determinism suite, especially under random ordering or xdist. An autouse fixture asserts
      it is at its default.
    answer:

  - q: Can recorded cassettes detect that a vendor changed its response?
    hypothesis: >
      No. A cassette replays the recording forever and is structurally incapable of noticing
      live drift. Cassettes still earn their place for pinning OUR parsing against a known
      shape, but the brief's guarantee-2 wording was wrong. Detecting drift needs a live check.
    answer:

  - q: Then how is vendor drift actually detected?
    hypothesis: >
      A scheduled canary fetches each vendor live and validates the response against a pydantic
      model with extra='forbid' and strict types. It writes no datapoints. This folds naturally
      into the 6h canary already decided in PRD-012 — same job, one more assertion.
    answer:

  - q: What guards against a reshaped response in normal ingestion?
    hypothesis: >
      Pydantic models with extra='forbid' and strict field types. Both are OFF by default —
      `extra` defaults to `ignore`, so a renamed field silently becomes absent. OKX returns
      every candle field as a string, so a lax float would accept a number, a string, or a
      null equally.
    answer:

  - q: Where do golden values come from?
    hypothesis: >
      At least one golden per indicator family must be computed OUTSIDE this codebase — by
      hand, or from a published reference vector — and the file must say which. A golden
      generated by the code under test only pins current behaviour: US-006 passed 6/6 while
      storing a Hong Kong day close, and a self-generated golden would have made that
      permanent and invisible.
    answer:

  - q: Which library, given the research?
    hypothesis: >
      Extend what PRD-001 already has rather than adopt a stack. httpx.MockTransport (already
      used in tests/test_okx_fetcher.py) for vendor shapes; goldens as small committed JSON
      with exact float equality; pydantic (already present via pydantic-settings) for response
      models. Rejected: pytest-regressions + pytest-recording + Hypothesis, which drag pandas
      and numpy into an ingestion package that has neither, for tooling this size does not need.
    answer:

  - q: How is a partial/truncated fetch handled?
    hypothesis: >
      As an ERROR, never as a shorter series. ccxt shipped exactly this bug on OKX — callers
      asking for 300 candles "silently receive fewer candles than requested... without obvious
      notification". And Freqtrade's "Missing data fillup" SYNTHESISES candles across gaps
      (logging 217.95% fillup on a 68%-incomplete series), which is guarantee 3 inverted:
      repair instead of error. We never synthesise a bar.
    answer:

out_of_scope:
  - New indicators, assets or vendors. This PRD hardens what exists.
  - Cross-source corroboration — PRD-003. Different mechanism: disagreement between vendors,
    not the correctness of one.
  - Any UI work.
  - Adopting pandas, numpy, pytest-regressions, pytest-recording or Hypothesis.
  - Changing the `datapoints` schema, unless a guarantee genuinely requires it.
  - Backfilling or repairing historical gaps in any form.

assumptions:
  - claim: TA-Lib is not yet a dependency, so the unstable-period hazard is preventable rather than present.
    tripwire: Any story adding TA-Lib must add the autouse fixture asserting the default unstable period in the same commit.
    acceptedBy: default
  - claim: The canary's live shape check can ride along in the PRD-012 6h canary job.
    tripwire: If PRD-012 is deprioritised, this PRD must ship its own scheduled job rather than dropping the check.
    acceptedBy: default
  - claim: Exact float equality is workable for goldens because inputs are fixed and the code is deterministic.
    tripwire: Any cross-platform float discrepancy — then, and only then, introduce a tolerance and record why.
    acceptedBy: default

chosen_approach:
  option: Extend the existing test idiom, plus one live drift canary
  because: >
    The offline harness costs almost no new dependencies and matches how PRD-001's tests are
    already written, so later stories will not fight it. The canary is included because
    without it the "vendor contract" guarantee ships a test that can never fail for the reason
    it was written.
  rejected:
    - option: Full off-the-shelf stack (pytest-regressions + pytest-recording + Hypothesis)
      because: Drags pandas and numpy into an ingestion package that has neither, and adds three file formats to review, for tooling at a scale we do not have.
    - option: Cassettes alone for vendor contract
      because: Structurally incapable of detecting drift — it only ever sees the recording.
    - option: Property-based invariants only
      because: Cannot catch a wrong-but-consistent value, which is exactly the US-006 defect.
