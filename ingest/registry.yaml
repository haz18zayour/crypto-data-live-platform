# Every row names its reusable golden and response model. Coverage resolves both
# declarations from the real files and runtime model mapping; neither is a parallel
# hand-maintained list of indicator keys.
# TA-Lib-backed entries declare the complete parameter set used for lookback validation.
# The 32 technical rows are the eight already-verified outputs for each of four assets.
- key: btc_daily_close
  vendor: okx
  endpoint: https://www.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=1Dutc
  source_field: 'okx candle[4] (close), where candle[8] == "1"; coinbase.close after mapping [time, low, high, open, close, volume] by venue; both use a 00:00 UTC boundary'
  definable_for: [BTC]
  not_definable:
    assets: [ETH, SOL, BNB]
    reasons: ["ETH: Daily close is intentionally BTC-only on this board; ETH has no daily-close cell here.", "SOL: Daily close is intentionally BTC-only on this board; SOL has no daily-close cell here.", "BNB: Daily close is intentionally BTC-only on this board; BNB has no daily-close cell here."]
  golden: btc_daily_close.json
  response_model: okx_candle
  required_bars: 1
  parameters:
  expected_update_interval_seconds: 86400
  freshness_warn_seconds: 108000
  freshness_stale_seconds: 172800
  corroboration:
    venue: coinbase
    pair: BTC-USD
    tolerance_bps: 25
