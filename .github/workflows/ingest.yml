name: ingest

on:
  schedule:
    - cron: '17 0 * * *'
  repository_dispatch:
    types: [ingest]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ingest.yml'
      - 'ingest/**'
      - 'pyproject.toml'
      - 'tests/test_heartbeat.py'
      - 'tests/test_ingest_workflow.py'
      - 'tests/test_persist_board.py'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  ingest:
    name: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ingestion
        run: uv run python -m ingest.heartbeat --tier daily
