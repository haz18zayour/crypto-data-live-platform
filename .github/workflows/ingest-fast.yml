name: ingest-fast

on:
  repository_dispatch:
    types: [ingest-fast]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-fast:
    name: ingest-fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECK_URL_INGEST_FAST }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run fast-tier ingestion
        run: uv run python -m ingest.heartbeat --tier fast
