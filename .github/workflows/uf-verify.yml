# The verifier of record when `.uf/config.json` sets verification.requireCi = true.
# An agent can be argued with. A CI conclusion cannot.
#
# This repo is Python (ingestion) + Node (web), and the web half does not exist until
# US-009. Every step below is therefore guarded on the manifest actually being present —
# `npm ci` in a repo with no package.json is ENOENT, not a skip, and `--if-present` does
# not help because it is npm itself that cannot start.
name: uf-verify

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect what this repo currently contains
        id: detect
        run: |
          test -f package.json   && echo "node=true"   >> "$GITHUB_OUTPUT" || echo "node=false"   >> "$GITHUB_OUTPUT"
          test -f pyproject.toml && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"
          test -d tests          && echo "tests=true"  >> "$GITHUB_OUTPUT" || echo "tests=false"  >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: 22
      - name: Install node deps
        if: steps.detect.outputs.node == 'true'
        run: npm ci || npm install
      - name: Node typecheck
        if: steps.detect.outputs.node == 'true'
        run: npm run typecheck --if-present
      - name: Node lint
        if: steps.detect.outputs.node == 'true'
        run: npm run lint --if-present
      - name: Node test
        if: steps.detect.outputs.node == 'true'
        run: npm test --if-present

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.python == 'true' || steps.detect.outputs.tests == 'true'
        with:
          python-version: '3.12'
      - name: Install uv
        if: steps.detect.outputs.python == 'true'
        uses: astral-sh/setup-uv@v5
      - name: Check migration ledger
        if: steps.detect.outputs.python == 'true'
        run: uv run python -m ingest.migrate --check
      - name: US-012 live PostgreSQL migration constraints
        if: steps.detect.outputs.python == 'true' && steps.detect.outputs.tests == 'true'
        run: uv run pytest tests/test_migration.py -q --no-header -o addopts= --tb=no -rN
      - name: Python typecheck
        if: steps.detect.outputs.python == 'true'
        run: uv run mypy ingest --strict
      - name: Python test
        if: steps.detect.outputs.tests == 'true'
        run: |
          if [ -f pyproject.toml ]; then
            uv run pytest -q
          else
            # Before US-002 there is no pyproject.toml and therefore no declared
            # dev-dependency on pytest; install it just for this step.
            python -m pip install --quiet pytest
            python -m pytest -q
          fi

      - name: Python integration tests (live venues)
        if: steps.detect.outputs.python == 'true'
        # Deselected from the default suite because running all of them together
        # throttles OKX and Coinbase. Run here, serially, and do not fail the build
        # on a venue rate-limiting us.
        continue-on-error: true
        run: uv run pytest -q -m integration -p no:randomly
