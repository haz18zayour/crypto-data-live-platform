name: reachability-spike

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachability-spike:
    name: reachability-spike
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run probe tests
        run: python -m unittest discover -s tests

      - name: Probe venue reachability from GitHub-hosted runner
        run: python scripts/probe_venues.py --out prds/PRD-001-spine/50-evidence/US-001/reachability-ci.json

      - name: Upload reachability evidence
        uses: actions/upload-artifact@v4
        with:
          name: reachability-json
          path: prds/PRD-001-spine/50-evidence/US-001/reachability-ci.json
